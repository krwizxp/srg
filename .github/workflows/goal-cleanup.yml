name: Cleanup completed Goal verification
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/goal-cleanup.yml
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove verified temporary run 35063436157
