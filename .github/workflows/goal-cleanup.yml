name: Cleanup completed Goal verification
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/goal-cleanup.yml
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove completed temporary run 35026236237
        run: gh api --method DELETE repos/krwizxp/srg/actions/runs/35026236237
      - name: Remove completed temporary run 35027304213
        run: gh api --method DELETE repos/krwizxp/srg/actions/runs/35027304213
      - name: Remove completed temporary run 35047984319
        run: gh api --method DELETE repos/krwizxp/srg/actions/runs/35047984319
      - name: Remove verified temporary branch 1
        run: gh api --method DELETE repos/krwizxp/srg/git/refs/heads/optimize/goal-20260915-audit
      - name: Remove verified temporary branch 2
        run: gh api --method DELETE repos/krwizxp/srg/git/refs/heads/optimize/goal-20260915-native-audit
