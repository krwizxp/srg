      - name: Stage and push perf patch
      run: |
      git rm .github/workflows/tmp-perf-validate.yml
          files=$(git diff --name-only origin/main | sort)
          echo "$files"
          count=$(echo "$files" | wc -l)
          test "$count" -eq 9
          test "$(echo "$files" | grep -c '\.rs$' || true)" -eq 7
          test "$(echo "$files" | grep -c '\.js$' || true)" -eq 2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply perf patch"
          git push origin HEAD:tmp/perf-validate
