name: TMP Web Validate
on:
  push:
    branches:
      - tmp/web-format-validate
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install tools
        run: npm install --no-save vscode-html-languageservice vscode-languageserver-textdocument html-validate vnu-jar
      - name: Remove blank lines and format revgeo.html
        run: |
          node -e '
          const fs = require("fs");
          const { getLanguageService } = require("vscode-html-languageservice");
          const { TextDocument } = require("vscode-languageserver-textdocument");
          const raw = fs.readFileSync("revgeo.html", "utf8");
          const lines = raw.split(/\r?\n/);
          const blankBefore = lines.filter(l => /^[ \t]*$/.test(l)).length;
          console.log("Blank/whitespace lines before:", blankBefore);
          const cleaned = lines.filter(l => !/^[ \t]*$/.test(l)).join("\n") + "\n";
          const doc = TextDocument.create("file:///revgeo.html", "html", 1, cleaned);
          const ls = getLanguageService();
          const edits = ls.format(doc, undefined, { insertSpaces: false, tabSize: 4 });
          const formatted = TextDocument.applyEdits(doc, edits);
          fs.writeFileSync("revgeo.html", formatted, "utf8");
          const blankAfter = formatted.split(/\r?\n/).slice(0, -1).filter(l => /^[ \t]*$/.test(l)).length;
          console.log("Blank/whitespace lines after:", blankAfter);
          '
      - name: Validate revgeo.html
        run: |
          VNU_JAR="$(node -e 'console.log(String(require("vnu-jar")))')"
          set +e
          VNU_OUT=$(java -jar "$VNU_JAR" --stdout --format text revgeo.html 2>&1)
          VNU_EXIT=$?
          set -e
          echo "$VNU_OUT"
          OTHER_ERRORS=$(echo "$VNU_OUT" | grep -i "error:" | grep -v "field-sizing" || true)
          if [ -n "$OTHER_ERRORS" ]; then
            echo "Unexpected vnu errors:"
            echo "$OTHER_ERRORS"
            exit 1
          fi
          npx html-validate revgeo.html
      - name: Remove tmp workflow and verify diff
        run: |
          git rm .github/workflows/tmp-web-validate.yml
          CHANGED=$(git diff --name-only origin/main)
          echo "Changed files vs origin/main: $CHANGED"
          if [ "$CHANGED" != "revgeo.html" ]; then
            echo "Expected only revgeo.html, got: $CHANGED"
            exit 1
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revgeo.html
          git commit -m "Format revgeo.html with VS Code HTML formatter"
          git push origin HEAD:tmp/web-format-validate
