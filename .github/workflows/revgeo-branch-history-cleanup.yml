name: Repository maintenance - revgeo test history cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/revgeo-branch-history-cleanup.yml]
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Remove completed revgeo temporary Actions runs and branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          expected_blob="e9c9fd444b7b05290ffaebe41d1b33e5c293b6c6"
          expected_branch_sha="6201cda8bd3eef4c16063b5cb33957864d1dece5"
          actual_main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)"
          actual_blob="$(gh api "repos/$repo/contents/revgeo.html?ref=main" --jq .sha)"
          actual_branch_sha="$(gh api "repos/$repo/git/ref/heads/chore/revgeo-vscode-format-20261021" --jq .object.sha)"
          test "$actual_main_sha" = "$GITHUB_SHA" || { echo "Main moved; aborting cleanup" >&2; exit 1; }
          test "$actual_blob" = "$expected_blob" || { echo "Validated HTML blob changed; aborting" >&2; exit 1; }
          test "$actual_branch_sha" = "$expected_branch_sha" || { echo "Temporary branch moved; aborting" >&2; exit 1; }
          work="$RUNNER_TEMP/revgeo-final-cleanup"
          mkdir -p "$work"
          gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, (.head_branch // ""), .status] | @tsv' > "$work/runs.tsv"
          : > "$work/targets.txt"
          while IFS=$'\t' read -r id branch status; do
            case "$branch" in
              chore/revgeo-optimize-20261020|chore/revgeo-verified-main-20261021|cleanup/revgeo-css-20261020|chore/revgeo-reopt-20261021|chore/revgeo-vscode-format-20261021)
                [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid run ID" >&2; exit 1; }
                test "$status" = "completed" || { echo "Refusing to delete active run $id" >&2; exit 1; }
                printf '%s\n' "$id" >> "$work/targets.txt"
                ;;
            esac
          done < "$work/runs.tsv"
          sort -nu "$work/targets.txt" -o "$work/targets.txt"
          grep -Fxq 39574456302 "$work/targets.txt" || { echo "Prior cleanup run unexpectedly missing" >&2; exit 1; }
          grep -Fxq 39582902724 "$work/targets.txt" || { echo "Fully validated formatting run missing" >&2; exit 1; }
          echo "TARGET_TEMP_RUNS=$(wc -l < "$work/targets.txt")"
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, (.workflow_run.id // 0)] | @tsv' > "$work/artifacts.tsv"
          deleted_artifacts=0
          while IFS=$'\t' read -r artifact run_id; do
            if grep -Fxq "$run_id" "$work/targets.txt"; then
              gh api -X DELETE "repos/$repo/actions/artifacts/$artifact" --silent
              deleted_artifacts=$((deleted_artifacts+1))
            fi
          done < "$work/artifacts.tsv"
          echo "DELETED_ARTIFACTS=$deleted_artifacts"
          deleted_runs=0
          while IFS= read -r run_id; do
            gh api -X DELETE "repos/$repo/actions/runs/$run_id" --silent
            echo "DELETED_TEMP_RUN=$run_id"
            deleted_runs=$((deleted_runs+1))
          done < "$work/targets.txt"
          echo "DELETED_TEMP_RUNS=$deleted_runs"
          gh api -X DELETE "repos/$repo/git/refs/heads/chore/revgeo-vscode-format-20261021" --silent
          echo "DELETED_TEMP_BRANCH=chore/revgeo-vscode-format-20261021"
          remaining_branches="$(gh api "repos/$repo/branches?per_page=100" --jq '.[].name')"
          test "$remaining_branches" = "main" || { echo "Unexpected remaining branches: $remaining_branches" >&2; exit 1; }
          gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id, (.head_branch // "")] | @tsv' > "$work/after.tsv"
          if grep -E 'chore/revgeo-(optimize|verified-main|reopt|vscode-format)-202610(20|21)|cleanup/revgeo-css-20261020' "$work/after.tsv"; then
            echo "Temporary workflow runs remain" >&2
            exit 1
          fi
          echo "FINAL_TEMP_BRANCH_AND_ACTIONS_CLEANUP_PASS"
