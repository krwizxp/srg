name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / latest stable Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use the latest GA Ubuntu image without waiting for ubuntu-latest migration.
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            binary_name: srg-linux-x64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            binary_name: srg-macos-x64
          - os: macos-26
            target: aarch64-apple-darwin
            binary_name: srg-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: srg-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Release Build
        run: cargo +stable build --release --frozen --bin srg --target "${{ matrix.target }}"
      - name: Prepare binary artifact with Rust
        env:
          CARGO_TARGET_DIR: target/${{ matrix.target }}
        run: cargo +stable run --frozen --example package_artifact -- "${{ matrix.binary_name }}"
      - name: Validate migrated Rust lattice tool and product
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain 1.99.1
          rustc +1.99.1 --version --verbose
          rustfmt +1.99.1 --edition 2024 --check tools/reduced_lattice_exhaustive.rs
          rustc +1.99.1 --edition 2024 -C opt-level=3 -C target-cpu=native -D warnings tools/reduced_lattice_exhaustive.rs -o reduced_lattice_exhaustive.exe
          if [ "$RUNNER_OS" = Linux ]; then
            cc -O3 -march=native -std=c11 -Wall -Wextra -Werror tools/_temp_reduced_lattice.c -o ./_temp_reduced_lattice
            node tools/_temp_verify_reduced_lattice.mjs ./reduced_lattice_exhaustive.exe ./_temp_reduced_lattice
          else
            node tools/_temp_verify_reduced_lattice.mjs ./reduced_lattice_exhaustive.exe
          fi
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 test --release --frozen --bin srg --target "${{ matrix.target }}"
          cargo +1.99.1 clippy --frozen --all-targets --target "${{ matrix.target }}"
      - name: Upload Release Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: artifacts/${{ matrix.binary_name }}.*
          archive: false
          if-no-files-found: error
          retention-days: 14
