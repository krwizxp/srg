name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / latest stable Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use the latest GA Ubuntu image without waiting for ubuntu-latest migration.
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            binary_name: srg-linux-x64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            binary_name: srg-macos-x64
          - os: macos-26
            target: aarch64-apple-darwin
            binary_name: srg-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: srg-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Release Build
        run: cargo +stable build --release --frozen --bin srg --target "${{ matrix.target }}"
      - name: Prepare binary artifact with Rust
        env:
          CARGO_TARGET_DIR: target/${{ matrix.target }}
        run: cargo +stable run --frozen --example package_artifact -- "${{ matrix.binary_name }}"
      - name: Verify production-only Rust compilation and behavior
        shell: bash
        run: |
          rustc +stable -Vv
          rustup +stable component add rustfmt clippy
          cargo +stable fmt --all -- --check
          cargo +stable clippy --frozen --all-targets --target "${{ matrix.target }}"
          cargo +stable test --release --frozen --bin srg --target "${{ matrix.target }}"
          executable="target/${{ matrix.target }}/release/srg"
          if [[ "$RUNNER_OS" == "Windows" ]]; then executable=".exe"; executable="target/${{ matrix.target }}/release/srg.exe"; fi
          "$executable" --version
          "$executable" --help
          if [[ "$RUNNER_ARCH" == "X64" ]]; then
            if "$executable" random-integer 2 1; then
              echo "Invalid numeric bounds unexpectedly accepted" >&2
              exit 1
            fi
          fi
          test ! -e src/boundary_inflate/tests.rs
          test ! -e src/korea_boundary/tests.rs
          test ! -e src/geo_uniform/tests.rs
          test ! -d src/boundary_inflate/tests
          test -f data/korea-boundary-v4/index.bin
          test -f data/korea-boundary-v4/tile-select-v5.bin
          test -f data/korea-boundary-v4/atlas-8.bin
          test "$(find data/korea-boundary-v4 -name 'part-*.bin' | wc -l)" -eq 96
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            node --check korea_boundary.js
            cargo +stable build --release --frozen --example manual_workflow
            if grep -qw rdrand /proc/cpuinfo; then
              mkdir -p artifacts
              (cd artifacts && "../$executable" generate 1) >/dev/null
              test -s artifacts/random_data.txt
            fi
          fi
      - name: Upload Release Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: artifacts/${{ matrix.binary_name }}.*
          archive: false
          if-no-files-found: error
          retention-days: 14
