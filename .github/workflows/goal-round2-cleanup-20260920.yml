name: Goal round 2 cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/goal-round2-cleanup-20260920.yml]
permissions: {}
jobs:
  cleanup:
    if: github.repository == 'krwizxp/srg' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Delete verified temporary branch, runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_REPOSITORY: krwizxp/srg
          CLEANUP_BRANCH: codex/goal-round2-20260920
          CLEANUP_SOURCE_SHA: e4e408a4ed3aa1dd3ced0fe94975fa401913d949
          CLEANUP_MERGED_SHA: dce36bad3a8f5fd87ea3fc9f2f7a368d2098c2d3
          CLEANUP_CI_ID: "35488406659"
          CLEANUP_RUNS: '[[35488011889,"e4e408a4ed3aa1dd3ced0fe94975fa401913d949"]]'
        run: python3 .github/validation/round2-cleanup.py
