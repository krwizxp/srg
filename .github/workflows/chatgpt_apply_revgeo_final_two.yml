name: Apply validated revgeo changes

on:
  push:
    branches:
      - chatgpt-revgeo-final-two-candidates

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply validated candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('revgeo.html')
          s = p.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          replace_once(
          '''                <button type="button" id="supp-dialog-cancel" class="action-btn">''',
          '''                <button type="button" commandfor="supp-dialog" command="request-close" class="action-btn">'''
          )
          replace_once(
          '''        const suppDialogCancel = document.getElementById("supp-dialog-cancel");\n''',
          ''''''
          )
          replace_once(
          '''        suppDialogCancel.addEventListener(\n          "click",\n          () => finishSupplementRequest(null),\n        );\n''',
          ''''''
          )
          replace_once(
          '''        const binaryBytes = new Array(bytes.length);\n        const hexBytes = new Array(bytes.length);\n        for (let i = 0; i < bytes.length; i += 1) {\n          binaryBytes[i] = bytes[i].toString(2).padStart(8, "0");\n          hexBytes[i] = hexByte(bytes[i]);\n        }''',
          '''        const binaryBytes = new Array(bytes.length);\n        const hex = bytes.toHex().toUpperCase();\n        for (let i = 0; i < bytes.length; i += 1) {\n          binaryBytes[i] = bytes[i].toString(2).padStart(8, "0");\n        }'''
          )
          replace_once(
          '''          `16진수: ${hexBytes.join(" ")}`,\n          `Hex 코드: #${hexBytes[0]}${hexBytes[1]}${hexBytes[2]} #${hexBytes[3]\n          }${hexBytes[4]}${hexBytes[5]}`,''',
          '''          `16진수: ${hex.slice(0, 2)} ${hex.slice(2, 4)} ${hex.slice(4, 6)} ${hex.slice(6, 8)} ${hex.slice(8, 10)} ${hex.slice(10, 12)} ${hex.slice(12, 14)} ${hex.slice(14)}`,\n          `Hex 코드: #${hex.slice(0, 6)} #${hex.slice(6, 12)}`,'''
          )
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "revgeo.html"
      - name: Commit clean source change
        shell: bash
        run: |
          rm .github/workflows/chatgpt_apply_revgeo_final_two.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test "$(git diff --cached --name-only | tr '\n' ' ')" = ".github/workflows/chatgpt_apply_revgeo_final_two.yml revgeo.html "
          git diff --cached --check
          git commit -m "Simplify revgeo dialog and hex formatting"
          git push origin HEAD:chatgpt-revgeo-final-two-candidates
