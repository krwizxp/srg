name: Temporary Rust 1.97.1 Toolchain Export
on:
  push:
    branches:
      - temp/rust-1.97.1-toolchain-export
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install exact toolchain and targets
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.97.1 \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          rustc +1.97.1 --version --verbose
          cargo +1.97.1 --version --verbose
          rustfmt +1.97.1 --version
          cargo +1.97.1 clippy --version
      - name: Package toolchain
        run: |
          set -euo pipefail
          cd "$HOME/.rustup/toolchains"
          tar -czf "$RUNNER_TEMP/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz" 1.97.1-x86_64-unknown-linux-gnu
          sha256sum "$RUNNER_TEMP/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz" > "$RUNNER_TEMP/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz.sha256"
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.97.1-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz.sha256
          compression-level: 0
          retention-days: 1
