name: Temporary web bottleneck isolated benchmarks
on:
  pull_request:
    paths:
      - '.github/workflows/validation-web-bottlenecks.yml'
      - 'validation/**'
      - 'korea_boundary.js'
      - 'src/geo_uniform.rs'
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install browsers
        run: |
          npm install --prefix validation --no-save playwright
          validation/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Check JavaScript syntax
        run: node --check korea_boundary.js
      - name: Benchmark independent candidates
        run: node validation/bench_isolated.mjs
      - name: Compare deflate and polygon allocation approaches
        run: node validation/bench_expanded.mjs
      - name: Install latest stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Compile production Rust polygon sampler probe
        run: |
          sed '/^#\[path = /d' validation/probe_sampler.rs > src/probe_sampler.rs
          rustc +1.99.1 --edition=2024 -O src/probe_sampler.rs -o validation/probe_sampler
          validation/probe_sampler > validation/probe-output.txt
      - name: Check Rust formatting and Clippy
        run: |
          rustup component add rustfmt clippy --toolchain 1.99.1
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 clippy --all-targets --frozen
          cargo +1.99.1 test --release --frozen
      - name: Compare production Rust and browser polygon results
        run: node validation/verify_rust_web.mjs
      - name: Compare old and new end-to-end mapping behavior
        run: node validation/verify_browser.mjs
      - name: Check 120k Rust geography distribution before and after
        run: |
          git worktree add --detach /tmp/srg-baseline d749b386c7a0aad665cb8686ddbd78abcc894cb8
          cp src/probe_sampler.rs /tmp/srg-baseline/src/probe_sampler.rs
          rustc +1.99.1 --edition=2024 -O /tmp/srg-baseline/src/probe_sampler.rs -o validation/baseline-probe
          SRG_SAMPLE_COUNT=120000 validation/baseline-probe > validation/baseline-distribution.txt
          SRG_SAMPLE_COUNT=120000 validation/probe_sampler > validation/candidate-distribution.txt
          node validation/verify_distribution.mjs
