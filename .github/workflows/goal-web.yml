name: Temporary Goal cache and regression validation
on:
  push:
    branches:
      - optimize/goal-20260915-audit
permissions:
  contents: read
jobs:
  browsers:
    name: ${{ matrix.engine }} verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      GOAL_WORK: /tmp/goal-web-${{ github.run_id }}
      GOAL_ENGINE: ${{ matrix.engine }}
      GOAL_PLAYWRIGHT: /tmp/goal-node-${{ github.run_id }}/node_modules/playwright/index.mjs
      CARGO_TARGET_DIR: /tmp/goal-target-${{ github.run_id }}
      GOAL_COMMON_CORPUS: /tmp/goal-web-${{ github.run_id }}/manual.csv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare independent corpus and isolated copies
        run: python3 goal-verify/prepare.py
      - name: Install reference compiler
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Record compiler
        run: rustc +1.98.1 -Vv
      - name: Install native linking dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Build native common conversion probe
        run: cargo +1.98.1 build --release --frozen --manifest-path "$GOAL_WORK/probe/Cargo.toml"
      - name: Generate native expectations
        run: '"$CARGO_TARGET_DIR/release/srg" > "$GOAL_WORK/manual-rust.txt"'
      - name: Install isolated browser runner
        run: npm install --prefix "/tmp/goal-node-${{ github.run_id }}" --no-audit --no-fund playwright@1.63.0
      - name: Install stable browser engines and OS dependencies
        run: node "/tmp/goal-node-${{ github.run_id }}/node_modules/playwright/cli.js" install --with-deps ${{ matrix.engine }}
      - name: Verify behavior in real browser
        run: node goal-verify/verify.mjs
      - name: Measure affected cache paths
        run: node goal-verify/cache-perf.mjs
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goal-web-${{ matrix.engine }}
          path: /tmp/goal-web-${{ github.run_id }}/results/*.json
          retention-days: 1
