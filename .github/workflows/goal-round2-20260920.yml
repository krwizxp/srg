name: Goal round 2 validation
on:
  push:
    branches:
      - codex/goal-round2-20260920
permissions:
  contents: read
jobs:
  target-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --target ${{ matrix.target }} --no-self-update
      - run: cargo +1.98.1 clippy --all-targets --target ${{ matrix.target }} --frozen -- -D warnings
      - run: git diff --check
  native-release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            probe_args: ""
          - os: macos-26-intel
            probe_args: --native-only
          - os: macos-26
            probe_args: --native-only
          - os: windows-latest
            probe_args: --native-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - if: runner.os == 'Linux'
        run: cargo +1.98.1 fmt --check -- --config newline_style=Unix
      - run: python3 .github/validation/round2_verify.py srg 7906172d9667bd0889c8c8a4ced0a3b692de9168 ${{ matrix.probe_args }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@latest
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python3 .github/validation/round2-browser-server.py 7906172d9667bd0889c8c8a4ced0a3b692de9168
