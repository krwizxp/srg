name: Cleanup verified optimization branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-optimization-20260913.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify optimization commit is integrated
        run: git merge-base --is-ancestor 5d02502523ed49c257a4473bf9bba6920cafc4cc HEAD
      - name: Configure repository authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com
      - name: Delete the verified temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --force-with-lease=refs/heads/optimize/20260913-validation:5d02502523ed49c257a4473bf9bba6920cafc4cc :refs/heads/optimize/20260913-validation
      - name: Verify previous temporary branch is integrated
        run: git merge-base --is-ancestor d69b9c4d7d31be268a7f3ce20c1220127f763790 HEAD
      - name: Delete the previous verified temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --force-with-lease=refs/heads/codex/goal-20260912:d69b9c4d7d31be268a7f3ce20c1220127f763790 :refs/heads/codex/goal-20260912
