name: Boundary optimization temporary validation
on:
  push:
    branches: [codex/srg-optimization-measure-20261028]
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') { throw 'Native Windows x64 required' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --no-self-update
      - run: rustc +1.99.1 -Vv
      - run: cargo +1.99.1 fmt --check
      - run: cargo +1.99.1 clippy --all-targets --frozen
      - run: cargo +1.99.1 test --all-targets --frozen
      - shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/srg-baseline" 1300842994d74d96076237c60f498384a5fa029e
          python tools/validation/native_check.py "$PWD" "$RUNNER_TEMP/srg-baseline"
      - run: cargo +1.99.1 build --release --frozen --target "${{ matrix.target }}"
      - env:
          CARGO_TARGET_DIR: target/${{ matrix.target }}
        run: cargo +1.99.1 run --frozen --example package_artifact -- "srg-${{ matrix.target }}"
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: |
          git worktree add --detach baseline-validation 1300842994d74d96076237c60f498384a5fa029e
          python3 -m http.server 8765 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for engine in chromium firefox webkit; do
            SRG_ENGINE="$engine" node tools/validation/browser_check.cjs
          done
