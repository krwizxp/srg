name: Trim obsolete progress reduced motion rule

on:
  push:
    branches:
      - chatgpt-progress-final-apply-20260828

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Remove obsolete native progress selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('revgeo.html')
          s=p.read_text()
          old='''      .progress-shell::-webkit-progress-value,\n      .progress-shell::-moz-progress-bar {\n        animation: none;\n      }\n\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one obsolete reduced-motion rule, got {s.count(old)}')
          p.write_text(s.replace(old, '', 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "revgeo.html"
      - name: Commit clean source-only result
        shell: bash
        run: |
          rm .github/workflows/chatgpt_trim_progress_reduced_motion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove obsolete native progress rule'
          git push origin HEAD:chatgpt-progress-final-apply-20260828
