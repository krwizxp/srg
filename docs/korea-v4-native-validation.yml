name: Temporary Korea v4 native validation
on:
  push:
    branches:
      - verify/korea-v4-20261029
permissions:
  contents: read
concurrency:
  group: korea-v4-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Rust 1.99.1 / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            executable: srg
          - os: macos-26-intel
            target: x86_64-apple-darwin
            executable: srg
          - os: macos-26
            target: aarch64-apple-darwin
            executable: srg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: srg.exe
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Install Linux native dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Record compiler and validation commit
        run: |
          rustc +1.99.1 --version --verbose
          git rev-parse HEAD
      - name: Require native compiler host
        shell: bash
        run: |
          test "$(rustc +1.99.1 --version --verbose | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - name: Verify Windows x64 native environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $srgOperatingSystem = Get-CimInstance Win32_OperatingSystem
          $srgOperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          if ($srgOperatingSystem.Caption -notlike '*Windows Server 2025*') { throw 'Windows Server 2025 is required' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'X64') { throw 'Native x64 OS is required' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne 'X64') { throw 'Native x64 process is required' }
      - name: Native release build
        run: cargo +1.99.1 build --release --frozen --bin srg --target "${{ matrix.target }}"
      - name: Native release tests
        run: cargo +1.99.1 test --release --frozen --bin srg --target "${{ matrix.target }}"
      - name: Standalone x86-64 generation smoke
        if: matrix.target != 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir native-smoke
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "native-smoke/${{ matrix.executable }}"
          cd native-smoke
          "./${{ matrix.executable }}" generate 1
      - name: Standalone ARM64 manual-input golden smoke
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir native-smoke
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "native-smoke/${{ matrix.executable }}"
          cd native-smoke
          printf '%s\n' 6 7 0 7692749122476142258 17567096863141291845 15544540983045798238 0 | "./${{ matrix.executable }}"
          printf '%s  %s\n' '82f1f563dca3e807970d35561b165a9f70f4133d8bd18a8d8529c816d4a83486' random_data.txt | shasum -a 256 -c -
